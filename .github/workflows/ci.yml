name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node 24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          if [ -f test-output.log ]; then
            grep -E '✖|not ok|AssertionError|Error:|failureType' test-output.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo '--- test output tail ---'
            tail -n 50 test-output.log
          fi

      - name: Build check
        run: npm run build
